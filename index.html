<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Tab Icon (Favicon) -->
    <link rel="icon" type="image/jpeg" href="/assets/profile.jpg" />
    <link rel="apple-touch-icon" href="/assets/profile.jpg" />

    <!-- Primary Meta Tags -->
    <title>Rhazel Alforque | Full-stack developer (C#/.NET, React), Cebu City</title>
    <meta
      name="description"
      content="Full-stack developer in Cebu City, Philippines. I build business software with C#, ASP.NET Core, SQL Server and React. Open to junior .NET and full-stack roles."
    />
    <meta name="author" content="Rhazel Alforque" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph (link previews need an absolute image URL) -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Rhazel Alforque | Full-stack developer (C#/.NET, React)" />
    <meta
      property="og:description"
      content="Business software built with C#, ASP.NET Core, SQL Server and React. Open to junior .NET and full-stack roles."
    />
    <meta property="og:image" content="https://russ-dev-t86v.vercel.app/assets/profile.jpg" />
    <meta name="twitter:card" content="summary" />

    <!-- Apply saved / OS theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rhazel_theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
